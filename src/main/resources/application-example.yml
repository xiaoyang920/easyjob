spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: true
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/easyjob?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: ${REDIS_DB:0}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: 1
        acknowledge-mode: auto
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}
          temperature: 0.7
          max-tokens: 5000
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY:}
      embedding:
        options:
          model: ${ZHIPU_EMBEDDING_MODEL:embedding-3}
          dimensions: ${ZHIPU_EMBEDDING_DIMENSIONS:2048}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}

server:
  port: ${SERVER_PORT:8080}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

agent:
  embedding:
    execution:
      core-pool-size: ${EMBEDDING_CORE_THREADS:8}
      max-pool-size: ${EMBEDDING_MAX_THREADS:8}
      queue-capacity: ${EMBEDDING_QUEUE_CAPACITY:16}
      keep-alive-seconds: 60
      per-article-parallelism: ${EMBEDDING_ARTICLE_PARALLELISM:4}
      batch-size: 16
      article-timeout: ${EMBEDDING_ARTICLE_TIMEOUT:120s}
  index-outbox:
    consumer-concurrency: ${ARTICLE_INDEX_CONCURRENCY:4}
  internal-transport: ${AGENT_INTERNAL_TRANSPORT:triple}
  rpc:
    target: ${AGENT_RPC_TARGET:127.0.0.1:50051}
    bind: ${BLOG_RPC_BIND:127.0.0.1}
    port: ${BLOG_RPC_PORT:20881}
  conversation:
    max-rounds: 20
    redis-ttl: 7200
    redis-key-prefix: "agent:conv:"
  rag:
    enabled: true
    chunk-size: 500
    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.7
    es-index: article_vectors
  web-search:
    enabled: ${AGENT_WEB_SEARCH_ENABLED:true}
    base-url: ${DEEPSEEK_TOOLS_BASE_URL:https://api.deepseek.com/v1}
    max-results: 5

easyjob:
  jwt:
    secret-key: ${JWT_SECRET_KEY:}
    ttl: 604800000
    token-name: Bearer

file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
  base-url: ${FILE_BASE_URL:}
  access:
    url: /uploads
  thumbnail:
    width: 400
    quality: 0.85
    categories: covers,articles

reranker:
  model: ${RERANKER_MODEL:qwen3-vl-rerank}

# Explicit one-time HTML chunk rebuild; calls the configured Embedding service.
rag:
  reindex:
    enabled: ${RAG_REINDEX_ENABLED:false}
