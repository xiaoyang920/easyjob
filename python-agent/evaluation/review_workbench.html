<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'">
<title>EasyJob 回答人工评审</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2efe7;color:#191916;font:15px/1.7 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:16px 4%;border-bottom:1px solid #ccc;background:#fffdf7}header h1{font-size:20px;margin:0}main{max-width:1400px;margin:auto;padding:24px}button,input,select,textarea{font:inherit;border:1px solid #aaa;border-radius:8px;padding:7px 10px;background:#fffdf7}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{padding:20px;margin-bottom:18px;border:1px solid #ccc;border-radius:16px;background:#fffdf7}.card h2{font-size:17px;margin:0 0 12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:0}.rubric{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rubric label{display:grid;gap:6px}small,.note{color:#68685e}.primary{background:#caff4b;border-color:#191916}#notice{color:#9b3c24}textarea{width:100%;min-height:90px}summary{cursor:pointer}.source{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}@media(max-width:800px){.columns,.rubric{grid-template-columns:1fr}}</style>
<header><h1>回答人工评审</h1><div class="toolbar"><span id="progress"></span><label>评审人 <input id="reviewer" maxlength="80" placeholder="姓名或固定代号"></label><button id="previous">上一题</button><button id="next">下一题</button><button id="export" class="primary">导出已完成标注</button><label>导入标注 <input id="import" type="file" accept=".jsonl"></label></div><p id="notice" role="status"></p></header>
<main><section class="card"><h2 id="question"></h2><p class="note" id="category"></p><p>先独立判断事实、推理和任务完成情况，再展开自动核验记录。常识、合理建议与示意代码不因没有引文而判错；具体版本、实测数字、来源事实需检查对应材料。</p><details><summary>查看冻结来源资料</summary><div id="sources"></div></details></section>
<div class="columns"><section class="card"><h2>修正前候选回答</h2><pre id="candidate"></pre></section><section class="card"><h2>最终交付回答</h2><pre id="final"></pre></section></div>
<section class="card"><h2>人工判断</h2><form id="form"><div class="rubric">
<label>用户任务是否完成<select name="task_completed" required><option value="">请选择</option><option value="true">完成</option><option value="false">未完成</option></select></label>
<label>最终回答是否上下文连贯<select name="context_coherent" required><option value="">请选择</option><option value="true">连贯</option><option value="false">割裂</option></select></label>
<label>候选中正确、可保留的内容单元数<input name="candidate_correct_units" type="number" min="0" step="1" required></label>
<label>其中被误删或误拦的单元数<input name="falsely_blocked_units" type="number" min="0" step="1" required></label>
<label>最终回答需证据的具体事实数<input name="specific_facts" type="number" min="0" step="1" required></label>
<label>其中缺乏依据的具体事实数<input name="unsupported_specific_facts" type="number" min="0" step="1" required></label>
</div><p><label>判断说明<textarea name="notes" placeholder="注明问题位置、缺失条件及参考来源"></textarea></label></p><p><label><input id="attest" type="checkbox" required> 我已亲自阅读问题、回答与相关资料，以上不是自动生成的标签。</label></p><button class="primary">保存本题标注</button></form></section>
<details class="card"><summary>展开自动核验记录（仅供对照）</summary><pre id="audit"></pre></details></main>
<script id="bundle" type="application/json">__EVALUATION_BUNDLE__</script>
<script>
const data=JSON.parse(document.getElementById('bundle').textContent),storageKey='easyjob-human-review:'+data.hash;
let index=0,reviews={};const $=id=>document.getElementById(id),form=$('form');
try{reviews=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const fields=['task_completed','context_coherent','candidate_correct_units','falsely_blocked_units','specific_facts','unsupported_specific_facts'];
function valid(r,item){return r && r.assessor==='human' && typeof r.reviewer==='string' && r.reviewer.trim() && r.candidate_hash===item.candidate_hash && r.final_hash===item.final_hash && fields.slice(0,2).every(k=>typeof r[k]==='boolean') && fields.slice(2).every(k=>Number.isSafeInteger(r[k])&&r[k]>=0) && r.falsely_blocked_units<=r.candidate_correct_units && r.unsupported_specific_facts<=r.specific_facts}
function note(text){$('notice').textContent=text}
function render(){const item=data.items[index];if(!item){note('没有可评审输出');form.hidden=true;return}form.reset();$('question').textContent=item.query;$('category').textContent=item.id+' · '+item.category;$('candidate').textContent=item.candidate||'（没有候选文本）';$('final').textContent=item.final||'（没有交付文本）';$('audit').textContent=JSON.stringify(item.audit,null,2);$('sources').replaceChildren();for(const source of item.sources){const pre=document.createElement('pre');pre.className='source';pre.textContent=JSON.stringify(source,null,2);$('sources').append(pre)}const saved=reviews[item.id];if(valid(saved,item)){for(const k of [...fields,'notes'])form.elements.namedItem(k).value=String(saved[k]??'');$('reviewer').value=saved.reviewer;$('attest').checked=true}const count=data.items.filter(i=>valid(reviews[i.id],i)).length;$('progress').textContent=`第 ${index+1}/${data.items.length} 题 · 已标注 ${count}/${data.expected}`;$('previous').disabled=index===0;$('next').disabled=index===data.items.length-1;form.querySelector('button').disabled=!!item.error||data.mode!=='live';$('export').disabled=data.mode!=='live';note(item.error?'本题采集失败：'+item.error+'，不得标注为已完成。':data.mode!=='live'?'这是离线回放，不能导出为真实质量评测标签。':'标注只暂存在当前浏览器；请导出文件保存。')}
form.onsubmit=event=>{event.preventDefault();const item=data.items[index],r={id:item.id,assessor:'human',reviewer:$('reviewer').value.trim(),candidate_hash:item.candidate_hash,final_hash:item.final_hash,notes:form.elements.namedItem('notes').value};for(const k of fields)r[k]=k==='task_completed'||k==='context_coherent'?form.elements.namedItem(k).value==='true':Number(form.elements.namedItem(k).value);if(!$('attest').checked||!valid(r,item)){note('请填写评审人，并检查分子不能大于分母。');return}reviews[item.id]=r;try{localStorage.setItem(storageKey,JSON.stringify(reviews))}catch{note('本机暂存失败，请立即导出。');return}render();note('本题已暂存；可继续下一题或导出。')};
$('previous').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<data.items.length-1){index++;render()}};
$('export').onclick=()=>{const rows=data.items.filter(i=>valid(reviews[i.id],i)).map(i=>reviews[i.id]);if(!rows.length){note('请先完成至少一题标注');return}const url=URL.createObjectURL(new Blob([rows.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/x-ndjson'}));const a=document.createElement('a');a.href=url;a.download='reviews.completed.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onchange=async event=>{try{const rows=(await event.target.files[0].text()).trim().split('\n').filter(Boolean).map(JSON.parse),incoming={},seen=new Set();for(const row of rows){const item=data.items.find(i=>i.id===row.id);if(seen.has(row.id)||!item||!valid(row,item))throw Error('文件包含重复、未知或过期标签');seen.add(row.id);incoming[row.id]=row}reviews={...reviews,...incoming};localStorage.setItem(storageKey,JSON.stringify(reviews));render()}catch(error){note(error.message)}};
render();
</script></html>
