name: Regression checks
on:
  push:
  pull_request:
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f gateway/pom.xml verify
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B '-Dtest=!EasyjobApplicationTests' test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  agent:
    runs-on: ubuntu-latest
    services:
      redis-stack:
        image: redis/redis-stack-server:7.4.0-v8
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    defaults:
      run:
        working-directory: python-agent
    env:
      DEEPSEEK_API_KEY: offline-test-key
      ZHIPUAI_API_KEY: offline-test-key
      LANGFUSE_TRACING_ENABLED: 'false'
      SERVICE_DISCOVERY_ENABLED: 'false'
      AGENT_SERVICE_KEY: offline-service-key-32-bytes-long!!
      REDIS_STACK_HOST: 127.0.0.1
      REDIS_STACK_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify shared Protobuf contracts
        run: python ../scripts/generate-rpc.py --check
      - name: Validate dependency metadata and MCP imports
        run: |
          python -m pip check
          python -c "from langchain_mcp_adapters.client import MultiServerMCPClient; from mcp.server.fastmcp import FastMCP"
      - run: python -m unittest discover -s tests
      - name: Latest Redis checkpoint, parallel failure, and approval recovery
        env:
          EASYJOB_CHECKPOINT_REDIS_TEST: '1'
        run: python -m unittest discover -s tests -p test_checkpoint_store.py -v
  rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-agent/requirements.txt
      - run: pip install -r python-agent/requirements.txt
      - name: Real Dubbo Triple and Python gRPC interoperability
        run: RPC_TEST_PYTHON="$(command -v python)" mvn -B -Dtest=RpcTransportTests,RpcInteropTests test
      - name: Isolated RPC endpoint churn and fault load
        run: python scripts/rpc-stability-check.py --users 16 --seconds 5 --churn 64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-stability
          path: logs/rpc-stability*
