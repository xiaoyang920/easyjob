name: Integration and browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_DATABASE: easyjob_ci
          TZ: Asia/Shanghai
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-local-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
      rabbit:
        image: rabbitmq:4.1
        ports: ['5672:5672']
      consul:
        image: hashicorp/consul:1.20.6
        ports: ['8500:8500']
    env:
      EASYJOB_CI: '1'
      TZ: Asia/Shanghai
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-local-only
      MYSQL_DB: easyjob_ci
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/easyjob_ci?serverTimezone=GMT%2B8
      SPRING_PROFILES_ACTIVE: ci
      DEEPSEEK_API_KEY: offline-test-key
      ZHIPUAI_API_KEY: offline-test-key
      DASHSCOPE_API_KEY: offline-test-key
      AGENT_SERVICE_KEY: ci-local-only-service-key-32-chars
      MAIL_HOST: 127.0.0.1
      MAIL_USERNAME: ci@example.invalid
      LANGFUSE_TRACING_ENABLED: 'false'
      SERVICE_DISCOVERY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: python-agent/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Start Elasticsearch with IK analysis
        run: |
          docker build -t easyjob-ci-elasticsearch tests/integration/elasticsearch
          docker run -d --name easyjob-ci-elasticsearch --memory=1536m \
            -p 127.0.0.1:9200:9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e 'ES_JAVA_OPTS=-Xms512m -Xmx512m' easyjob-ci-elasticsearch
          python - <<'PY'
          import json, subprocess, time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s', timeout=3) as response:
                      health = json.load(response)
                  if not health.get('timed_out') and health.get('status') in ('yellow', 'green'):
                      break
              except OSError:
                  pass
              time.sleep(2)
          else:
              subprocess.run(['docker', 'logs', 'easyjob-ci-elasticsearch'], check=False)
              raise RuntimeError('Elasticsearch startup failed')
          PY
      - name: Bootstrap disposable schema and apply migrations
        working-directory: python-agent
        run: |
          pip install -r requirements.txt
          python -m pip check
          python -c "from langchain_mcp_adapters.client import MultiServerMCPClient; from mcp.server.fastmcp import FastMCP"
          python -m evaluation.ci_bootstrap
          python -m app.migrate
      - name: Real MySQL interaction concurrency and rollback checks
        env:
          EASYJOB_INTERACTION_DB_TEST: '1'
        run: mvn -B -Dtest=ArticleInteractionMysqlTests test
      - name: Start Agent-owned query service without model calls or workers
        run: |
          mkdir -p logs
          python tests/integration/agent-query-peer.py > logs/integration-agent.log 2>&1 &
      - name: Build and start Java with dummy credentials and model dispatch disabled
        run: |
          mkdir -p temp logs
          cp src/main/resources/application-example.yml temp/application-ci.yml
          export JWT_SECRET_KEY="$(python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(64)).decode())')"
          mvn -B -DskipTests package
          java -jar target/easyjob-0.0.1-SNAPSHOT.jar --spring.config.location=file:./temp/application-ci.yml --spring.rabbitmq.listener.simple.auto-startup=false --agent.index-outbox.enabled=false > logs/integration-java.log 2>&1 &
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8080/api/article/list',timeout=2) as response:
                      body=json.load(response)
                  if body.get('code')==200:
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(2)
          else:
              print(Path('logs/integration-java.log').read_text(errors='replace')[-30000:])
              raise RuntimeError('Java startup failed')
          PY
          mvn -B -f gateway/pom.xml -DskipTests package
          java -jar gateway/target/easyjob-gateway-0.0.1-SNAPSHOT.jar > logs/integration-gateway.log 2>&1 &
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          for _ in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8090/api/article/list',timeout=3) as response:
                      if json.load(response).get('code')==200: break
              except (OSError,ValueError): pass
              time.sleep(2)
          else:
              print(Path('logs/integration-gateway.log').read_text(errors='replace')[-20000:])
              raise RuntimeError('Gateway startup failed')
          PY
      - name: Real API, SQL and workbook regression
        working-directory: python-agent
        run: |
          python -m evaluation.admin_statistics
          python -m evaluation.admin_categories
          python -m evaluation.platform --seed-browser
      - name: Browser regression
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Cleanup isolated fixtures
        if: always()
        working-directory: python-agent
        run: |
          if test -f ../temp/platform-browser-fixture.json; then python -m evaluation.platform --cleanup; fi
      - name: Collect Elasticsearch diagnostics and stop container
        if: always()
        run: |
          mkdir -p logs
          if docker inspect easyjob-ci-elasticsearch > /dev/null 2>&1; then
            docker logs easyjob-ci-elasticsearch > logs/integration-elasticsearch.log 2>&1
            docker rm -f easyjob-ci-elasticsearch
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            temp/*-results.json
            temp/playwright-report/
            temp/playwright-results/
            logs/integration-java.log
            logs/integration-agent.log
            logs/integration-gateway.log
            logs/integration-elasticsearch.log
          retention-days: 7
