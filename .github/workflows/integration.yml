name: Integration and browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_DATABASE: easyjob_ci
          TZ: Asia/Shanghai
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-local-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
      rabbit:
        image: rabbitmq:4.1
        ports: ['5672:5672']
      consul:
        image: hashicorp/consul:1.20.6
        ports: ['8500:8500']
    env:
      EASYJOB_CI: '1'
      EASYJOB_TEST_API: http://127.0.0.1:8090
      EASYJOB_TEST_UNIFIED_AUTH: '1'
      TZ: Asia/Shanghai
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-local-only
      MYSQL_DB: easyjob_ci
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/easyjob_ci?serverTimezone=GMT%2B8
      SPRING_PROFILES_ACTIVE: ci
      DEEPSEEK_API_KEY: offline-test-key
      ZHIPUAI_API_KEY: offline-test-key
      DASHSCOPE_API_KEY: offline-test-key
      AGENT_SERVICE_KEY: ci-local-only-service-key-32-chars
      MAIL_HOST: 127.0.0.1
      MAIL_USERNAME: ci@example.invalid
      MAIL_PASSWORD: ci-unused
      MANAGEMENT_HEALTH_MAIL_ENABLED: 'false'
      LANGFUSE_TRACING_ENABLED: 'false'
      SERVICE_DISCOVERY_ENABLED: 'true'
      SEARCH_INDEX_SERVICE_KEY: ci-local-only-search-index-key-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/python-agent/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Start Elasticsearch with IK analysis
        run: |
          docker build -f tests/integration/elasticsearch/Dockerfile -t easyjob-ci-elasticsearch .
          docker run -d --name easyjob-ci-elasticsearch --memory=1536m \
            -p 127.0.0.1:9200:9200 \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e 'ES_JAVA_OPTS=-Xms512m -Xmx512m' easyjob-ci-elasticsearch
          python - <<'PY'
          import json, subprocess, time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s', timeout=3) as response:
                      health = json.load(response)
                  if not health.get('timed_out') and health.get('status') in ('yellow', 'green'):
                      break
              except OSError:
                  pass
              time.sleep(2)
          else:
              subprocess.run(['docker', 'logs', 'easyjob-ci-elasticsearch'], check=False)
              raise RuntimeError('Elasticsearch startup failed')
          PY
      - name: Bootstrap disposable schema and apply migrations
        working-directory: services/python-agent
        run: |
          pip install -r requirements.txt
          python -m pip check
          python -c "from langchain_mcp_adapters.client import MultiServerMCPClient; from mcp.server.fastmcp import FastMCP"
          python -m evaluation.ci_bootstrap
          python -m app.migrate
      - name: Agent tracing over loopback TCP
        working-directory: services/python-agent
        run: python -m unittest discover -s ../../tests/integration -p test_agent_tracing.py -v
      - name: Real MySQL interaction concurrency and rollback checks
        env:
          EASYJOB_INTERACTION_DB_TEST: '1'
        run: mvn -B -f services/blog-service/pom.xml -Dtest=ArticleInteractionMysqlTests test
      - name: Configure the isolated Auth and Excel services
        run: |
          python scripts/generate-auth-keys.py temp/ci-auth-keys
          python - <<'PY'
          import base64, os, secrets
          from pathlib import Path

          folder = Path('temp/ci-auth-keys').resolve()
          auth_key = secrets.token_urlsafe(48)
          excel_key = secrets.token_urlsafe(48)
          jwt_key = base64.b64encode(secrets.token_bytes(64)).decode()
          for secret in (auth_key, excel_key, jwt_key):
              print(f'::add-mask::{secret}')
          values = {
              'JWT_SECRET_KEY': jwt_key,
              'REDIS_DB': '0',
              'AUTH_PRIVATE_KEY_FILE': folder / 'auth-private.json',
              'GATEWAY_PUBLIC_KEY_FILE': folder / 'gateway-public.json',
              'AUTH_SERVICE_KEY': auth_key,
              'EASYJOB_AUTH_ENABLED': 'true',
              'EASYJOB_AUTH_BASE_URL': 'http://127.0.0.1:8081',
              'EASYJOB_AUTH_JWKS_URI': 'http://127.0.0.1:8081/api/auth/jwks',
              'EASYJOB_AUTH_SERVICE_KEY': auth_key,
              'EASYJOB_AUTH_GATEWAY_PRIVATE_KEY_FILE': folder / 'gateway-private.json',
              'EASYJOB_AUTH_GATEWAY_PUBLIC_KEY_FILE': folder / 'gateway-public.json',
              'EASYJOB_AUTH_BLOG_PRIVATE_KEY_FILE': folder / 'blog-delegation-private.json',
              'AUTH_DELEGATION_ENABLED': 'true',
              'BLOG_DELEGATION_PUBLIC_KEY_FILE': folder / 'blog-delegation-public.json',
              'AUTH_SERVICE_BASE_URL': 'http://127.0.0.1:8081',
              'AUTH_SERVICE_CHECK_KEY': auth_key,
              'EXCEL_DB_URL': os.environ['MYSQL_URL'],
              'EXCEL_DB_USER': os.environ['MYSQL_USER'],
              'EXCEL_DB_PASSWORD': os.environ['MYSQL_PASSWORD'],
              'EASYJOB_EXCEL_SERVICE_KEY': excel_key,
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for name, value in values.items():
                  env.write(f'{name}={value}\n')
          PY
      - name: Start Agent-owned query service without model calls or workers
        run: |
          mkdir -p logs
          python tests/integration/agent-query-peer.py > logs/integration-agent.log 2>&1 &
      - name: Start authenticated Nacos for the index discovery test
        run: |
          export NACOS_AUTH_TOKEN="$(python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(48)).decode())')"
          export NACOS_AUTH_IDENTITY_KEY="easyjob-ci"
          export NACOS_AUTH_IDENTITY_VALUE="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose -p easyjob-ci-nacos -f deploy/compose.nacos.yml up -d --wait --wait-timeout 90
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$password"
          curl -fsS --max-time 10 --data-urlencode "password=$password" \
            http://127.0.0.1:8848/nacos/v3/auth/user/admin >/dev/null
          {
            echo 'EASYJOB_NACOS_ENABLED=true'
            echo "EASYJOB_NACOS_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Start Blog, Auth, Excel and Gateway with production routing
        run: |
          mkdir -p temp logs
          cp services/blog-service/src/main/resources/application-example.yml temp/application-ci.yml
          mvn -B -DskipTests package
          java -jar services/auth-service/target/easyjob-auth-0.0.1-SNAPSHOT.jar > logs/integration-auth.log 2>&1 &
          java -jar services/blog-service/target/easyjob-0.0.1-SNAPSHOT.jar --spring.config.location=file:./temp/application-ci.yml --spring.rabbitmq.listener.simple.auto-startup=false > logs/integration-java.log 2>&1 &
          java -jar services/excel-service/target/easyjob-excel-0.0.1-SNAPSHOT.jar > logs/integration-excel.log 2>&1 &
          java -jar services/gateway/target/easyjob-gateway-0.0.1-SNAPSHOT.jar > logs/integration-gateway.log 2>&1 &
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          for name, path, field, expected in [
              ('auth', '8081/actuator/health', 'status', 'UP'),
              ('java', '8080/actuator/health', 'status', 'UP'),
              ('excel', '8083/actuator/health', 'status', 'UP'),
              ('gateway', '8090/api/auth/jwks', 'keys', None),
              ('gateway', '8090/api/article/list', 'code', 200),
          ]:
              deadline = time.monotonic() + 90
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(f'http://127.0.0.1:{path}', timeout=3) as response:
                          value = json.load(response).get(field)
                          if (bool(value) if expected is None else value == expected):
                              break
                  except (OSError, ValueError):
                      pass
                  time.sleep(2)
              else:
                  print(Path(f'logs/integration-{name}.log').read_text(errors='replace')[-20000:])
                  raise RuntimeError(f'{name} readiness failed at {path}')
          PY
      - name: Verify RabbitMQ article indexing with Nacos discovery
        env:
          SEARCH_INDEX_BLOG_URL: http://127.0.0.1:1
          SEARCH_INDEX_LOCK_USER: root
          SEARCH_INDEX_LOCK_PASSWORD: ci-local-only
          SEARCH_INDEX_LOCK_URL: jdbc:mysql://127.0.0.1:3306/?useSSL=false&allowPublicKeyRetrieval=true
          ZHIPUAI_BASE_URL: http://127.0.0.1:18084
        run: |
          python tests/integration/search-index-smoke.py --embedding-fixture > logs/index-embedding.log 2>&1 &
          java -jar services/search-index-service/target/easyjob-search-index-0.0.1-SNAPSHOT.jar > logs/integration-search-index.log 2>&1 &
          python tests/integration/search-index-smoke.py
      - name: Real API, SQL and workbook regression
        working-directory: services/python-agent
        run: |
          python -m evaluation.admin_statistics
          python -m evaluation.admin_categories
          python -m evaluation.platform --seed-browser
      - name: Browser regression
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --test ../browser-extension/tests/browser.spec.mjs
          npx playwright test
      - name: Cleanup isolated fixtures
        if: always()
        working-directory: services/python-agent
        run: |
          if test -f ../../temp/platform-browser-fixture.json; then python -m evaluation.platform --cleanup; fi
      - name: Collect Elasticsearch diagnostics and stop container
        if: always()
        run: |
          mkdir -p logs
          if docker inspect easyjob-ci-elasticsearch > /dev/null 2>&1; then
            docker logs easyjob-ci-elasticsearch > logs/integration-elasticsearch.log 2>&1
            docker rm -f easyjob-ci-elasticsearch
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            temp/*-results.json
            temp/playwright-report/
            temp/playwright-results/
            logs/integration-java.log
            logs/integration-auth.log
            logs/integration-excel.log
            logs/integration-agent.log
            logs/integration-gateway.log
            logs/integration-elasticsearch.log
            logs/integration-search-index.log
          retention-days: 7
