services:
  nacos:
    image: nacos/nacos-server:v3.3.0
    environment:
      MODE: standalone
      FUNCTION_MODE: microservice
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN for Nacos}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY for Nacos}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE for Nacos}
    ports:
      - "127.0.0.1:18848:8080"
      - "127.0.0.1:8848:8848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  nacos-data:
