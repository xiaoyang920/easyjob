syntax = "proto3";
package com.easyjob.rpc.v1;
option java_package = "com.easyjob.rpc.v1";
option java_multiple_files = true;

// The identity is issued by an authenticated service, never by an LLM or browser.
// Do not log requests: this field contains the internal service credential.
message Identity { int64 user_id = 1; string service_key = 2; string trace_id = 3; string delegation_token = 4; string auth_session_id = 5; int64 auth_version = 6; }
// Preserve int64 IDs exactly; google.protobuf.Struct represents numbers as doubles.
message Value {
  oneof kind {
    string text = 1; sint64 integer = 2; double decimal = 3;
    bool boolean = 4; bool null_value = 5; Object object = 6; Array array = 7;
  }
}
message Object { map<string, Value> fields = 1; }
message Array { repeated Value items = 1; }
message Error { int32 status = 1; string message = 2; }
message Reply { oneof result { Value data = 1; Error error = 2; } }
message AgentQuery {
  Identity identity = 1; string kind = 2; string state = 3; string name = 4;
  int32 page = 5; int32 limit = 6; string start = 7; string end = 8; string source = 9;
  Object edit = 10;
}
// Browser chat, history, memory and SSE are served directly by Python HTTP.
// Internal Java callers only use bounded administrative/profile queries.
service AgentRpc {
  rpc ServiceQuery(AgentQuery) returns (Reply);
}
message DraftRequest {
  Identity identity = 1; string keyword = 2; int64 article_id = 3;
  string run_id = 4; string execution_token = 5; string title = 6;
  string summary = 7; string markdown = 8; string html = 9;
  string draft_hash = 10; optional string base_draft_hash = 11;
  optional string expected_revision_id = 12; optional int64 expected_lock_version = 13;
  string save_permit = 14;
}
// Only bounded business queries are exposed; never accept SQL or table names from callers.
message BlogQuery {
  Identity identity = 1; string kind = 2; repeated int64 ids = 3;
  repeated string names = 4; string name = 5; int64 target_id = 6;
  int32 page = 7; int32 limit = 8; int64 cursor = 9; Object expected = 10;
}
service BlogRpc {
  rpc ListDrafts(DraftRequest) returns (Reply);
  rpc ReadDraft(DraftRequest) returns (Reply);
  rpc SaveDraft(DraftRequest) returns (Reply);
  rpc ReadPublic(BlogQuery) returns (Reply);
  rpc Maintenance(BlogQuery) returns (Reply);
  rpc DraftReceipt(DraftRequest) returns (Reply);
}
